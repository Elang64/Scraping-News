version: "3.9"

networks:
  ews-network:
    name: ews-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

services:
  # FRONTEND (React Vite Glassmorphism UI)
  frontend:
    build:
      context: ./ews-fe
      dockerfile: Dockerfile
    container_name: ews-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://10.10.100.10:8000
    networks:
      - ews-network
    depends_on:
      - app

  # BACKEND (FastAPI + APScheduler + Telegram Bot Notifier)
  app:
    build:
      context: ./ews-be
      dockerfile: docker/Dockerfile
    container_name: ews-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./ews-be/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ews-be:/app
    networks:
      - ews-network

  # DATABASE (PostgreSQL 16)
  db:
    image: postgres:16-alpine
    container_name: ews-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ews_user
      POSTGRES_PASSWORD: ews_pass
      POSTGRES_DB: ews_db
    volumes:
      - ews_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ews-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ews_user -d ews_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ews_pgdata:
